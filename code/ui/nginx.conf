# nginx in front of the React SPA + reverse-proxy to the FastAPI service.
# All API/WS routes are matched explicitly so anything else falls through
# to the SPA (index.html) for client-side routing.

upstream api_upstream {
    server api:8000;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # ── api routes (proxied) ─────────────────────────────────────────
    # Keep this list in sync with code/ui/vite.config.js dev proxy.
    location ~ ^/(transcribe|scans|housemates|requests|splits|health|posts|ai|chats|regulars|settle-up|users|me|house|auth|session)(/|$) {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;   # SSE / streaming AI responses
    }

    # ── websocket upgrade ───────────────────────────────────────────
    location /ws {
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # ── static SPA + client-side routing fallback ────────────────────
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
