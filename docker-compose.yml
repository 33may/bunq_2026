# bunq flatmate — production compose.
#
#   docker compose up -d
#
# Brings up:
#   • postgres   — primary DB
#   • api        — FastAPI + uvicorn (uvicorn[standard] = websockets ready)
#   • ui         — nginx serving built React SPA + reverse-proxy to api
#
# Persistent state lives in named volumes so `docker compose down` is safe.
# Sandbox bunq keys are bind-mounted from ./code/.secrets so they're never
# baked into an image.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bunq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bunq}
      POSTGRES_DB: bunq
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bunq -d bunq"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./code
      dockerfile: Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://bunq:${POSTGRES_PASSWORD:-bunq}@postgres:5432/bunq
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      COOKIE_SECURE: "true"
      STORAGE_BACKEND: local
      UPLOAD_DIR: /app/.house/uploads
      PROFILE_DIR: /app/.house/profiles
      CORS_ORIGINS: '["http://localhost", "http://127.0.0.1"]'
    volumes:
      - house:/app/.house
      - ./code/.secrets:/app/.secrets:ro
    expose:
      - "8000"

  ui:
    build:
      context: ./code/ui
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    expose:
      - "80"

  # caddy fronts everything on :80 and :443. It auto-issues a Let's
  # Encrypt cert for ${DOMAIN} on first request via the HTTP-01
  # challenge, then forwards every path to the ui container (which
  # already proxies api/ws routes to the api container).
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - ui
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-bunqflatmate.duckdns.org}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  house:
  caddy_data:
  caddy_config:
